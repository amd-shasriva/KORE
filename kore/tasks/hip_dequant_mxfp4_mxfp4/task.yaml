task_id: hip_dequant_mxfp4_mxfp4
operation: hip_dequant_mxfp4
dtype: mxfp4
backend: hip
gpu_target: gfx950
seed_kernel_name: seed_hip.hip
snr_threshold: 40.0
op_family: hip_quant
baseline_tier: hip
# MXFP4 dequantization (OCP MXFP4: E2M1 codes packed 2/byte + biased-127 E8M0 per 32 elements), in HIP C++ (quantization family).
# Candidate ABI: a .hip file binding `forward` through
# PYBIND11_MODULE(TORCH_EXTENSION_NAME, m), taking/returning torch::Tensor.
# Correctness oracle: fp32 torch. Baseline (--impl reference):
# the eager torch path (nibble unpack, gather, exp2 scale, repeat_interleave), which materializes several full-size intermediates the seed never writes.
# The seed is correct but deliberately naive, so the headroom HipKittens
# measures for C++ tile primitives (1.3-3.0x over Triton on BF16 GEMM) is
# what the model has to find.
shape_policy:
  schema_version: 2
  policy_id: outer_rows
  status: eligible
  enabled: true
  source: generator:hip_dequant_mxfp4
  reason: explicit outer_rows transform with frozen non-target dimensions
  transforms:
  - name: outer_rows
    dims:
    - M
    relation: independent
    multiple: 1
    minimum: 2048
    regimes:
    - small
    - large
    - non_power_of_two
    - row_tail
    misalign_to: 8
    misalign_dim: null
    preserve_singleton: true
  constraints: []
  authored_hidden_shapes: []
  max_elements: 268435456
shapes:
  minimal: {M: 4096, N: 16384}
  primary: {M: 8192, N: 8192}
  validation:
    - {M: 2048, N: 32768}
    - {M: 32768, N: 2048}
    - {M: 8191, N: 8160}
targets:
  snr_db: 40.0
  comparison_baseline: torch_dequant_mxfp4
