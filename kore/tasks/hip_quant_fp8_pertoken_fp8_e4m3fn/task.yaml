task_id: hip_quant_fp8_pertoken_fp8_e4m3fn
operation: hip_quant_fp8_pertoken
dtype: fp8_e4m3fn
backend: hip
gpu_target: gfx950
seed_kernel_name: seed_hip.hip
snr_threshold: 20.0
op_family: hip_unary
baseline_tier: hip
# per-token fp8 e4m3 quantization, emitting codes and per-row scale, in HIP C++ (quantization family).
# Candidate ABI: a .hip file binding `forward` through
# PYBIND11_MODULE(TORCH_EXTENSION_NAME, m), taking/returning torch::Tensor.
# Correctness oracle: fp32 torch. Baseline (--impl reference):
# the eager torch path (absmax reduction, divide, cast), which is three separate kernel launches against the seed's one.
# The seed is correct but deliberately naive, so the headroom HipKittens
# measures for C++ tile primitives (1.3-3.0x over Triton on BF16 GEMM) is
# what the model has to find.
shape_policy:
  schema_version: 2
  policy_id: outer_rows
  status: eligible
  enabled: true
  source: generator:hip_quant_fp8_pertoken
  reason: explicit outer_rows transform with frozen non-target dimensions
  transforms:
  - name: outer_rows
    dims:
    - M
    relation: independent
    multiple: 1
    minimum: 2048
    regimes:
    - small
    - large
    - non_power_of_two
    - row_tail
    misalign_to: 8
    misalign_dim: null
    preserve_singleton: true
  constraints: []
  authored_hidden_shapes: []
  max_elements: 268435456
shapes:
  minimal: {M: 4096, N: 16384}
  primary: {M: 8192, N: 8192}
  validation:
    - {M: 2048, N: 32768}
    - {M: 32768, N: 2048}
    - {M: 8191, N: 8193}
targets:
  snr_db: 20.0
  comparison_baseline: torch_quant_fp8_pertoken
