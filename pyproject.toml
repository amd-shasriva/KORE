[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kore"
version = "0.1.0"
description = "KORE: multi-turn verifiable-reward RL for AMD ROCm kernel generation"
readme = "README.md"
license = { text = "LicenseRef-AMD-Proprietary-Internal" }
license-files = ["LICENSE", "THIRD_PARTY.md"]
requires-python = ">=3.10"
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
train = [
    "torch",
    "transformers>=4.44",
    "trl>=0.12",
    "peft>=0.13",
    "datasets>=2.20",
    "accelerate>=0.34",
]
value = ["xgboost>=2.0", "scikit-learn>=1.3", "numpy>=1.26"]
teacher = ["anthropic>=0.39", "openai>=1.40"]
test = [
    "pytest>=9.0,<10",
    "numpy>=2.2,<2.3",
    "torch>=2.10,<2.11",
    "datasets>=3.6,<3.7",
    "accelerate>=1.14,<1.15",
    "scikit-learn>=1.7,<1.8",
]
dev = ["pytest>=9.0,<10", "build>=1.5,<2"]

[project.scripts]
kore = "kore.cli:main"

[tool.setuptools.packages.find]
include = ["kore*"]
namespaces = false

[tool.setuptools.package-data]
kore = [
    "tasks/*/task.yaml",
    "tasks/*/reference.py",
    "tasks/*/driver.py",
    "tasks/*/seed*.py",
    # HIP C++ tasks declare seed_kernel_name: seed_hip.hip; without this the wheel
    # installs a task whose declared seed is absent.
    "tasks/*/seed*.hip",
    "tasks/*/*.h",
    "eval/data/*.jsonl",
    "data/replay_samples/*.jsonl",
    "data/knowledge/*.md",
    "openended/tests/*.json",
    "tasks/_drafts/*.json",
    "tasks/_drafts/*/*.md",
    "*.md",
    "*/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests", "kore"]
python_files = ["test_*.py"]
norecursedirs = [
    ".git",
    ".venv",
    "build",
    "dist",
    "gen_*",
    "genb_*",
    "genv_*",
]
addopts = [
    "-q",
    "--strict-markers",
    "--import-mode=importlib",
    "-m",
    "not gpu and not release",
]
# Every name here must select at least one test; tests/test_marker_contract.py
# fails the suite otherwise, so a marker cannot be declared (and deselected in
# addopts) while no test carries it. Adding a new opt-in group means adding its
# tests in the same change - `model`, `network` and `dependency` were removed
# because they selected nothing and their deselection was therefore a no-op.
markers = [
    "cpu: deterministic tests that run without an accelerator or external service",
    "gpu: opt-in tests that require a supported AMD GPU and ROCm",
    "packaging: source distribution, wheel, and installed-artifact contracts",
    "release: release-blocking checks intentionally excluded from the default suite",
    "shell: shell syntax and side-effect-free entrypoint help checks",
]
